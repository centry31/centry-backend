name: Backend Deploy Manual

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch/tag)'
        required: true
        default: 'release/0.0.0'
      deploy_path:
        description: 'Path to backend repo on server'
        required: true
        default: '/opt/centry/centry-backend-v2-clean'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            REF="${{ github.event.inputs.ref }}"
            DEPLOY_PATH="${{ github.event.inputs.deploy_path }}"
            TS="$(date +%Y%m%d-%H%M%S)"

            cd "$DEPLOY_PATH"
            mkdir -p /opt/backups/centry-manual
            cp -a .env "/opt/backups/centry-manual/backend.env.$TS"

            git fetch origin "$REF"
            git checkout "$REF"
            git pull --ff-only origin "$REF"

            yarn install --frozen-lockfile
            yarn build

            if pm2 describe centry-backend >/dev/null 2>&1; then
              pm2 restart centry-backend --update-env
            else
              pm2 start dist/main.js --name centry-backend
            fi
            pm2 save

            test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/)" != "000"
